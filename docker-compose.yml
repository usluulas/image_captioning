services:
  # 1. Modeli calistiran sunucu. Kendi bilgisayarinizdaki "Ollama" uygulamasinin container hali.
  ollama:
    # Sizin makinenizdeki Ollama surumune sabitlendi (ollama --version -> 0.32.3).
    # Bu etiket cekilemezse "ollama/ollama:latest" ile degistirin.
    image: ollama/ollama:0.32.3
    volumes:
      # Indirilen model kalici olarak burada durur; container silinse bile 4 GB tekrar inmez.
      - ollama-modelleri:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40
    restart: unless-stopped

  # 2. Python programi.
  betimleyici:
    build: .
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      # ollama kutuphanesi bu degiskeni otomatik okur; boylece localhost yerine
      # yandaki container'a baglanir. Kodda degisiklik gerekmez.
      OLLAMA_HOST: http://ollama:11434
      MODEL_ADI: gemma3:4b-it-qat
      # Arayuz container icinde 127.0.0.1'i dinlerse disaridan erisilemez; 0.0.0.0 sart.
      ARAYUZ_HOST: 0.0.0.0
    ports:
      # Tarayicidan http://localhost:7860 adresiyle acilir. Bastaki 127.0.0.1 onemli:
      # portu yalnizca bu bilgisayara acar, ayni agdaki diger cihazlar erisemez.
      - "127.0.0.1:7860:7860"
    volumes:
      # Bilgisayardaki gorseller/ klasoru, container icinde /gorseller olarak gorunur.
      # Arayuzden yuklenen dosyalar buraya degil, container icindeki gecici klasore gider.
      - ./gorseller:/gorseller:ro

volumes:
  ollama-modelleri:

